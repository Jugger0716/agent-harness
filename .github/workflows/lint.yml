name: lint
on: [push, pull_request]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        # `shell: bash` is what turns on pipefail (`bash --noprofile --norc -eo pipefail {0}`);
        # the default `run:` shell is `bash -e {0}` WITHOUT it, so a bare pipe would hide an
        # exit code. The OK-line assertion two steps below does not depend on this, by design.
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # A deliberate floor with no documented basis: this repository declares no Node
          # lower bound anywhere (measured: 0 declarations at v8.11.0). Pinned so a Node is
          # guaranteed present rather than relying on the runner image. Revisit when a lower
          # bound is declared.
          node-version: 20
      - run: node --version
      # Every lint MUST be invoked from a ONE-LINE `- run:` step: that form is the contract
      # .github/scripts/check_lint_wiring.sh greps. A block-form step would not be counted.
      - run: python3 scripts/verify_block_sync.py
      - run: python3 scripts/verify_manifest_sync.py
      - run: python3 scripts/verify_meta_literal.py
      - run: python3 scripts/verify_sync_markers.py
      # No separate EOL guard step: check_workflow_syntax.mjs already scans working-tree bytes
      # AND index blobs. Its own header calls the index guard a backstop rather than an
      # independent second line of defence under normal operation, and `.gitattributes
      # text eol=lf` normalises on check-in. What IS promoted here is its index-blob SKIP
      # -> a hard failure.
      - run: node scripts/check_workflow_syntax.mjs 2>&1 | tee "$RUNNER_TEMP/cws.log"
      - name: index-blob CR guard must not be skipped in CI
        run: |
          test -s "$RUNNER_TEMP/cws.log" || { echo "::error::cws.log missing — the syntax step did not run"; exit 1; }
          grep -Eq 'OK: [0-9]+ index blobs are LF' "$RUNNER_TEMP/cws.log" \
            || { echo "::error::index-blob CR guard OK line missing"; exit 1; }
          ! grep -q 'SKIP index-blob CR guard' "$RUNNER_TEMP/cws.log"
      - run: bash .github/scripts/check_lint_wiring.sh
